# Build image, push to GHCR, then run docker compose pull/up on the same machine (self-hosted runner == VPS).
name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Reclaim stale Docker artifacts
        shell: bash
        run: |
          docker image prune -af --filter "until=168h" || true
          docker builder prune -af --filter "until=168h" || true
          docker container prune -f || true

      - name: Verify at least 20 GB is free
        shell: bash
        run: |
          set -euo pipefail
          MIN_FREE_GB=20
          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
          if [[ -z "${docker_root}" || ! -d "${docker_root}" ]]; then
            docker_root=/var/lib/docker
          fi

          available_kb="$(df -Pk "${docker_root}" | awk 'NR == 2 { print $4 }')"
          required_kb=$(( MIN_FREE_GB * 1024 * 1024 ))
          if [[ ! "${available_kb}" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine free space for ${docker_root}." >&2
            exit 1
          fi
          if (( available_kb < required_kb )); then
            available_gb=$(( available_kb / 1024 / 1024 ))
            echo "Only ${available_gb} GB free on ${docker_root}; ${MIN_FREE_GB} GB is required." >&2
            exit 1
          fi
          echo "$(( available_kb / 1024 / 1024 )) GB free on ${docker_root}; preflight passed."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase for GHCR)
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy locally (runner == VPS)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "→ Pulling and starting containers..."
          docker compose pull
          docker compose up -d --remove-orphans
          echo "→ Pruning unused images..."
          docker image prune -f
          echo "Deploy done."
