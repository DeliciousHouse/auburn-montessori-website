name: Runner Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: runner-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Before cleanup
        continue-on-error: true
        shell: bash
        run: |
          echo 'Disk usage before cleanup:' || true
          df -h || true
          echo 'Docker usage before cleanup:' || true
          docker system df || true

      - name: Snapshot protected Docker state
        shell: bash
        run: |
          set -euo pipefail
          docker ps --no-trunc --format '{{.ID}}' | sort > "${RUNNER_TEMP}/running-containers.before"
          docker volume ls --format '{{.Name}}' | sort > "${RUNNER_TEMP}/docker-volumes.before"

      - name: Reclaim stale Docker artifacts
        continue-on-error: true
        shell: bash
        run: |
          docker image prune -af --filter "until=168h" || true
          docker builder prune -af --filter "until=168h" || true
          docker container prune -f || true

      - name: Purge stale runner files
        continue-on-error: true
        shell: bash
        run: |
          runner_root="$(cd "${RUNNER_TEMP}/../.." 2>/dev/null && pwd)" || true
          work_root="$(dirname "${RUNNER_WORKSPACE}")" || true

          if [[ -n "${runner_root}" && -d "${runner_root}/_diag" ]]; then
            find "${runner_root}/_diag" -type f -mtime +7 -delete || true
          else
            echo 'Runner _diag directory not found; skipping log cleanup.' || true
          fi

          if [[ -n "${work_root}" && -d "${work_root}" ]]; then
            find "${work_root}" -mindepth 1 -maxdepth 1 -type d -mtime +7 \
              ! -path "${RUNNER_WORKSPACE}" ! -name '_*' \
              -exec rm -rf -- {} + || true
          else
            echo 'Runner _work directory not found; skipping workspace cleanup.' || true
          fi

      - name: After cleanup
        continue-on-error: true
        shell: bash
        run: |
          echo 'Disk usage after cleanup:' || true
          df -h || true
          echo 'Docker usage after cleanup:' || true
          docker system df || true

      - name: Checkout activation scripts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Activate private node exporter
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAILSCALE_IP: 100.110.92.60
        run: bash scripts/install-node-exporter.sh

      - name: Verify exporter activation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAILSCALE_IP: 100.110.92.60
        run: |
          set -euo pipefail
          systemctl is-enabled node_exporter.service
          systemctl is-active node_exporter.service
          systemctl is-enabled github-actions-runner-directory-metrics.timer
          systemctl is-active github-actions-runner-directory-metrics.timer

          listeners="$(sudo ss -H -ltnp 'sport = :9100')"
          printf '%s\n' "${listeners}"
          local_addresses="$(printf '%s\n' "${listeners}" | awk '{ print $4 }' | sort -u)"
          if [[ "${local_addresses}" != "${TAILSCALE_IP}:9100" ]]; then
            printf 'port 9100 must listen only on %s; found: %s\n' \
              "${TAILSCALE_IP}" "${local_addresses:-none}" >&2
            exit 1
          fi

          metrics="$(curl --fail --silent "http://${TAILSCALE_IP}:9100/metrics")"
          runner_metrics="$(printf '%s\n' "${metrics}" |
            grep -E '^github_actions_runner_directory_bytes\{path="(_diag|_work)"\} [0-9]+$')"
          printf '%s\n' "${runner_metrics}"
          [[ "$(printf '%s\n' "${runner_metrics}" | wc -l)" -eq 2 ]]

      - name: Verify protected Docker state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps --no-trunc --format '{{.ID}}' | sort > "${RUNNER_TEMP}/running-containers.after"
          docker volume ls --format '{{.Name}}' | sort > "${RUNNER_TEMP}/docker-volumes.after"
          cmp "${RUNNER_TEMP}/running-containers.before" "${RUNNER_TEMP}/running-containers.after"
          cmp "${RUNNER_TEMP}/docker-volumes.before" "${RUNNER_TEMP}/docker-volumes.after"
          echo 'Running containers and Docker volumes are unchanged.'
